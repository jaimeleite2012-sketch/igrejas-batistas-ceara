{let q=$('#search').value.toLowerCase().trim(),r=$('#region').value,m=$('#hasMap').value,rows=churches.filter(x=>(!q||[x.name,x.region,x.address,city(x)].join(' ').toLowerCase().includes(q))&&(!r||x.region===r)&&(!m||(m==='yes'&&x.maps)));$('#count').textContent=rows.length+' de '+churches.length;$('#cards').innerHTML=rows.length?rows.map(x=>'<article class="card"><span class="tag">AIBRECE · '+esc(x.region)+'</span><h2>'+esc(x.name)+'</h2><p class="address">'+esc(x.address||('Região '+x.region+' — endereço não informado pela AIBRECE'))+'</p><div class="actions"><a class="maps" href="'+maps(x)+'" target="_blank" rel="noopener">Abrir no Google Maps</a><a class="earth" href="'+earth(x)+'" target="_blank" rel="noopener">Google Earth</a>'+(x.site?'<a class="site" href="'+esc(x.site)+'" target="_blank" rel="noopener">Site / rede oficial</a>':'')+'</div></article>').join(''):'<div class="empty"><b>Nenhuma igreja encontrada.</b><br>Limpe ou altere os filtros.</div>'; }['search','region','hasMap'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));$('#all').onclick=()=>{$('#search').value='';$('#region').value='';$('#hasMap').value='';render()};$('#clear').onclick=$('#all').onclick;$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(churches,null,2)],{type:'application/json'}));a.download='igrejas-aibrece-ceara.json';a.click()};$('#import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d)||!d.length)throw 0;churches=d;regions();render();$('#status').textContent=churches.length+' igrejas carregadas'}catch{alert('Arquivo JSON inválido.')}};const EXTRA_KEY='aibrece-contatos-v2';let extras={};try{extras=JSON.parse(localStorage.getItem(EXTRA_KEY)||'{}')}catch{}const full=x=>Object.assign({},x,extras[x.id]||{});const basicRender=render;render=function(){let q=$('#search').value.toLowerCase().trim(),r=$('#region').value,m=$('#hasMap').value,rows=churches.filter(x=>{let y=full(x);return(!q||[y.name,y.region,y.address,city(y),y.pastor,y.whatsapp].join(' ').toLowerCase().includes(q))&&(!r||y.region===r)&&(!m||(m==='yes'&&y.maps))});$('#count').textContent=rows.length+' de '+churches.length;$('#cards').innerHTML=rows.length?rows.map(x=>{let y=full(x),info=(y.pastor?'<p class="contact"><b>Pastor:</b> '+esc(y.pastor)+'</p>':'')+(y.whatsapp?'<p class="contact"><b>WhatsApp:</b> '+esc(y.whatsapp)+'</p>':'');return '<article class="card"><span class="tag">AIBRECE · '+esc(y.region)+'</span><h2>'+esc(y.name)+'</h2><p class="address">'+esc(y.address||('Região '+y.region+' — endereço não informado pela AIBRECE'))+'</p>'+info+'<div class="actions"><a class="maps" href="'+maps(y)+'" target="_blank" rel="noopener">Abrir no Google Maps</a><a class="earth" href="'+earth(y)+'" target="_blank" rel="noopener">Google Earth</a><button class="btn edit" data-edit="'+y.id+'">Editar pastor e WhatsApp</button>'+(y.site?'<a class="site" href="'+esc(y.site)+'" target="_blank" rel="noopener">Site / rede oficial</a>':'')+'</div></article>'}).join(''):'<div class="empty"><b>Nenhuma igreja encontrada.</b><br>Limpe ou altere os filtros.</div>'};function openEdit(id){let x=churches.find(v=>v.id===id),e=extras[id]||{};$('#editId').value=id;$('#editTitle').textContent=x.name;$('#pastor').value=e.pastor||'';$('#whatsapp').value=e.whatsapp||'';$('#lat').value=e.lat||'';$('#lng').value=e.lng||'';$('#editor').hidden=false}$('#cards').addEventListener('click',e=>{let b=e.target.closest('[data-edit]');if(b)openEdit(b.dataset.edit)});$('#cancelEdit').onclick=()=>$('#editor').hidden=true;$('#editor').onclick=e=>{if(e.target===$('#editor'))$('#editor').hidden=true};$('#editForm').onsubmit=e=>{e.preventDefault();let id=$('#editId').value,lat=$('#lat').value.trim(),lng=$('#lng').value.trim();if((lat||lng)&&(!Number.isFinite(Number(lat))||!Number.isFinite(Number(lng))))return alert('Latitude e longitude precisam ser numéricas.');extras[id]={pastor:$('#pastor').va
