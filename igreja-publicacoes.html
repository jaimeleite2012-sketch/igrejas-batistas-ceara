<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12345b"><title>Mural, relatórios e notícias da igreja</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172c46}header{background:#12345b;color:white;padding:22px max(18px,calc((100vw - 1040px)/2))}header a{color:white}main{max-width:1040px;margin:auto;padding:22px 16px 60px}h1{font-size:clamp(1.5rem,4vw,2.2rem)}h2{font-size:1.25rem}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button,.btn{border:1px solid #c5d2e0;background:white;color:#15385f;padding:11px 15px;border-radius:10px;font:inherit;font-weight:650;cursor:pointer}.tabs button[aria-selected=true],.primary{background:#15569b!important;color:white!important}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:15px}.card,.panel{background:white;border:1px solid #d8e0eb;border-radius:15px;padding:17px;overflow-wrap:anywhere}.card img{width:100%;max-height:240px;object-fit:cover;border-radius:9px}.meta{color:#526579;font-size:.9rem}.card a{color:#135ca1}.panel{margin:18px 0}label{display:block;font-weight:650;margin:10px 0}input,textarea,select{display:block;width:100%;font:inherit;padding:10px;border:1px solid #aebdcd;border-radius:8px;margin-top:5px}textarea{min-height:100px}.notice{padding:13px;border-radius:10px;background:#eaf1fa}button:disabled{opacity:.5}#adminPanel[hidden],#empty[hidden]{display:none}@media(prefers-color-scheme:dark){body{background:#101a29;color:#edf3fc}.card,.panel,.tabs button{background:#1a2a3e;color:#edf3fc;border-color:#40546e}.meta{color:#b9c8dc}.notice{background:#213b57}input,textarea,select{background:#101a29;color:white;border-color:#61748a}.card a{color:#8fc4ff}}
</style></head><body><header><a href="index.html">← Voltar ao aplicativo</a><h1 id="churchTitle">Mural e publicações da igreja</h1><p>Eventos, relatórios e notícias da comunidade</p></header><main><nav class="tabs" aria-label="Categorias de publicações"><button type="button" data-kind="event" aria-selected="true">Mural de eventos</button><button type="button" data-kind="report" aria-selected="false">Relatórios PDF</button><button type="button" data-kind="news" aria-selected="false">Notícias</button></nav><p class="notice" id="status" role="status">Carregando publicações…</p><section class="cards" id="cards" aria-live="polite"></section><p id="empty" hidden>Nenhuma publicação nesta área até o momento.</p><section class="panel" id="adminPanel" hidden><h2>Gerenciar publicações</h2><p class="meta">Apenas o administrador geral autenticado pode publicar ou excluir conteúdo.</p><form id="publicationForm"><label>Categoria<select id="kind" required><option value="event">Evento / foto / cartaz</option><option value="report">Relatório em PDF</option><option value="news">Notícia / comunicado</option></select></label><label>Título<input id="title" required maxlength="180" minlength="3"></label><label>Descrição / notícia<textarea id="description"></textarea></label><label>Data do evento (opcional)<input id="eventDate" type="date"></label><label>Arquivo (imagem JPG, PNG ou WebP; PDF para relatórios; até 10 MB)<input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></label><button class="btn primary" type="submit">Publicar</button></form></section></main><script>
const URL_BASE='https://pltpqhboxughkpybixcb.supabase.co',KEY='sb_publishable_CHpRWYjYhDpEDnzHr7c1Aw_a3mgyJKF',params=new URLSearchParams(location.search),churchId=params.get('church'),churchName=params.get('name')||'Igreja',token=sessionStorage.getItem('church-admin-token')||'';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let selected='event',items=[],isAdmin=false;
$('#churchTitle').textContent=churchName;
function api(path,options={}){return fetch(URL_BASE+path,{...options,headers:{apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',...(options.headers||{})}})}
function fileUrl(path){return URL_BASE+'/storage/v1/object/public/church-publications/'+path.split('/').map(encodeURIComponent).join('/')}
function draw(){const rows=items.filter(x=>x.kind===selected);$('#empty').hidden=rows.length>0;$('#cards').innerHTML=rows.map(x=>'<article class="card">'+(x.file_path&&x.file_type?.startsWith('image/')?'<a href="'+esc(fileUrl(x.file_path))+'" target="_blank" rel="noopener"><img loading="lazy" src="'+esc(fileUrl(x.file_path))+'" alt="'+esc(x.title)+'"></a>':'')+'<h2>'+esc(x.title)+'</h2>'+(x.event_date?'<p class="meta">Evento: '+esc(new Date(x.event_date+'T12:00:00').toLocaleDateString('pt-BR'))+'</p>':'')+'<p>'+esc(x.description).replace(/\n/g,'<br>')+'</p>'+(x.file_path?'<p><a href="'+esc(fileUrl(x.file_path))+'" target="_blank" rel="noopener">'+(x.file_type==='application/pdf'?'Abrir / baixar PDF':'Abrir imagem')+'</a></p>':'')+(isAdmin?'<button class="btn" type="button" data-delete="'+esc(x.id)+'">Excluir publicação</button>':'')+'</article>').join('')}
async function load(){if(!churchId){$('#status').textContent='Identificador da igreja não informado. Volte ao diretório.';return}try{const r=await api('/rest/v1/church_publications?select=*&church_id=eq.'+encodeURIComponent(churchId)+'&order=created_at.desc');if(!r.ok)throw Error('Tabela indisponível ('+r.status+'). É necessário aplicar a migração no Supabase.');items=await r.json();$('#status').textContent=items.length+' publicação(ões) disponíveis.';draw()}catch(e){$('#status').textContent='Não foi possível carregar as publicações: '+e.message}}
async function checkAdmin(){if(!token)return;try{const r=await api('/rest/v1/directory_admins?select=user_id&limit=1');if(!r.ok)return;const rows=await r.json();const payload=JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));isAdmin=rows.some(x=>x.user_id===payload.sub);$('#adminPanel').hidden=!isAdmin}catch(e){isAdmin=false}}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{selected=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));$('#kind').value=selected;draw()});
$('#kind').onchange=e=>{selected=e.target.value;document.querySelector('[data-kind="'+selected+'"]').click()};
$('#publicationForm').onsubmit=async e=>{e.preventDefault();if(!isAdmin)return;const kind=$('#kind').value,title=$('#title').value.trim(),description=$('#description').value.trim(),file=$('#file').files[0];if(title.length<3)return alert('Informe um título com pelo menos 3 caracteres.');if(kind==='report'&&(!file||file.type!=='application/pdf'))return alert('Relatórios exigem um arquivo PDF.');if(file&&(file.size>10485760||!(kind==='report'?file.type==='application/pdf':['image/jpeg','image/png','image/webp'].includes(file.type))))return alert('Tipo de arquivo incompatível ou acima de 10 MB.');const button=e.submitter;button.disabled=true;let path=null;try{if(file){path=churchId+'/'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await fetch(URL_BASE+'/storage/v1/object/church-publications/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':file.type},body:file});if(!up.ok)throw Error('Falha no envio do arquivo ('+up.status+').')}const body={church_id:churchId,kind,title,description,event_date:kind==='event'?($('#eventDate').value||null):null,file_path:path,file_type:file?.type||null};const r=await api('/rest/v1/church_publications',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});if(!r.ok)throw Error('Não foi possível registrar a publicação ('+r.status+').');$('#publicationForm').reset();await load();alert('Publicação realizada com sucesso.')}catch(err){alert(err.message+(path?' O arquivo pode ter sido enviado; verifique o armazenamento antes de repetir.':''))}finally{button.disabled=false}};
$('#cards').onclick=async e=>{const b=e.target.closest('[data-delete]');if(!b||!isAdmin||!confirm('Excluir esta publicação?'))return;const row=items.find(x=>x.id===b.dataset.delete);const r=await api('/rest/v1/church_publications?id=eq.'+encodeURIComponent(b.dataset.delete),{method:'DELETE'});if(!r.ok)return alert('Não foi possível excluir.');if(row?.file_path){const path=row.file_path.split('/').map(encodeURIComponent).join('/');await fetch(URL_BASE+'/storage/v1/object/church-publications/'+path,{method:'DELETE',headers:{apikey:KEY,Authorization:'Bearer '+token}})}await load()};
checkAdmin().then(load);
</script></body></html>
